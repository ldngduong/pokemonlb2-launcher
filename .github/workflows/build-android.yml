name: Build Android Launcher APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename and Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PokemonLegendBlack2-Android.apk
          ls -lh PokemonLegendBlack2-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonLegendBlack2-Android
          path: PokemonLegendBlack2-Android.apk
