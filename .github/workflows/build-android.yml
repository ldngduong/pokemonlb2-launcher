name: Build Android Modded melonDS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.gitmodules'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/**/libs.versions.toml

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Signing and Build APK
        working-directory: android
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MELONDS_KEYSTORE" ]; then
            echo "$MELONDS_KEYSTORE" | base64 -d > "${{ runner.workspace }}/keystore.jks"
            {
              echo "MELONDS_KEYSTORE=${{ runner.workspace }}/keystore.jks"
              echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD"
              echo "MELONDS_KEY_ALIAS=melonds"
              echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD"
            } >> local.properties
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubProdRelease --no-daemon

      - name: Prepare Release APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          cp "$APK_PATH" PokemonLegendBlack2-Android.apk
          ls -lh PokemonLegendBlack2-Android.apk

      - name: Verify APK upgrades the public launcher
        run: |
          curl -fsSL https://github.com/ldngduong/pokemonlb2-launcher/releases/download/v1.0.0/PokemonLegendBlack2-Android.apk -o old.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          aapt=$(dirname "$apksigner")/aapt
          old_cert=$("$apksigner" verify --print-certs old.apk | grep -F 'certificate SHA-256 digest:')
          new_cert=$("$apksigner" verify --print-certs PokemonLegendBlack2-Android.apk | grep -F 'certificate SHA-256 digest:')
          test "$old_cert" = "$new_cert"
          old_pkg=$("$aapt" dump badging old.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          new_pkg=$("$aapt" dump badging PokemonLegendBlack2-Android.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$old_pkg" = com.legendblack2.app && test "$old_pkg" = "$new_pkg"
          old_version=$("$aapt" dump badging old.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          new_version=$("$aapt" dump badging PokemonLegendBlack2-Android.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
          test "$new_version" -gt "$old_version"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonLegendBlack2-Android
          path: PokemonLegendBlack2-Android.apk
